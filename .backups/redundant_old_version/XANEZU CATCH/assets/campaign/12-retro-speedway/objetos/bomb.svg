<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
        <defs>
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
        </filter>
        <filter id="glow">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="superGlow">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <!-- Gold Gradient -->
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD700" />
            <stop offset="50%" stop-color="#FFA500" />
            <stop offset="100%" stop-color="#FF8C00" />
        </linearGradient>
        <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFE4B5" />
            <stop offset="100%" stop-color="#FFD700" />
        </linearGradient>

        <!-- Silver/Steel Gradient -->
        <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E0E0E0" />
            <stop offset="50%" stop-color="#9E9E9E" />
            <stop offset="100%" stop-color="#616161" />
        </linearGradient>

        <!-- Gem Gradients -->
        <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF5252" />
            <stop offset="100%" stop-color="#B71C1C" />
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#69F0AE" />
            <stop offset="100%" stop-color="#1B5E20" />
        </linearGradient>
        <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E0F7FA" />
            <stop offset="100%" stop-color="#00BCD4" />
        </linearGradient>

        <radialGradient id="highlight" cx="30%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <g filter='url(#dropShadow)'><circle cx='50' cy='60' r='35' fill='#212121'/><circle cx='40' cy='50' r='15' fill='url(#highlight)' opacity='0.4'/><rect x='40' y='15' width='20' height='15' fill='#757575'/><path d='M50,15 Q60,5 75,10' fill='none' stroke='#8D6E63' stroke-width='4'/><polygon points='75,10 80,0 85,10 95,15 85,20 80,30 75,20 65,15' fill='#FFEB3B' filter='url(#glow)'/></g>
</svg>
