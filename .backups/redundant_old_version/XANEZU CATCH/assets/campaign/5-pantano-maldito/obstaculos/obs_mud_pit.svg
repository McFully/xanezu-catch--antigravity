<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" preserveAspectRatio="none">
  <defs>
    <radialGradient id="mudglow" cx="50%" cy="80%">
      <stop offset="0%" stop-color="#44ff88" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#44ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mud1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5820"/>
      <stop offset="100%" stop-color="#4a7c28"/>
    </linearGradient>
    <filter id="mudblur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- Glow pool -->
  <ellipse cx="50" cy="175" rx="45" ry="25" fill="url(#mudglow)" filter="url(#mudblur)"/>
  <!-- Mud pit walls (sides) -->
  <path d="M0 80 Q0 200 0 200 L100 200 Q100 200 100 80 Q80 70 50 72 Q20 70 0 80Z" fill="#2d4a15"/>
  <!-- Inner mud (darker) -->
  <ellipse cx="50" cy="140" rx="42" ry="50" fill="#1a3a0a"/>
  <!-- Mud surface layer with bubbles -->
  <ellipse cx="50" cy="110" rx="42" ry="18" fill="#3a5820"/>
  <!-- Mud surface swirl -->
  <path d="M15 108 Q30 100 50 108 Q70 116 85 108" stroke="#4a7c28" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M20 114 Q35 106 55 114 Q70 120 82 114" stroke="#4a7c28" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Bubbles on surface -->
  <circle cx="30" cy="106" r="6" fill="#2d4a15" stroke="#4a7c28" stroke-width="1.5"/>
  <circle cx="55" cy="103" r="4" fill="#2d4a15" stroke="#4a7c28" stroke-width="1.5"/>
  <circle cx="72" cy="108" r="5" fill="#2d4a15" stroke="#4a7c28" stroke-width="1.5"/>
  <!-- Bubble shine dots -->
  <circle cx="28" cy="104" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="53" cy="101" r="1" fill="white" opacity="0.6"/>
  <circle cx="70" cy="106" r="1.5" fill="white" opacity="0.6"/>
  <!-- Rim of pit (wooden/stone) -->
  <path d="M0 80 Q20 68 50 70 Q80 68 100 80" fill="#5a3a10" stroke="#3a2005" stroke-width="2"/>
  <!-- Wooden plank detail -->
  <rect x="5" y="72" width="25" height="10" rx="3" fill="#7a5010" stroke="#3a2005" stroke-width="1" transform="rotate(-5,17,77)"/>
  <rect x="40" y="70" width="20" height="10" rx="3" fill="#7a5010" stroke="#3a2005" stroke-width="1"/>
  <rect x="70" y="72" width="25" height="10" rx="3" fill="#7a5010" stroke="#3a2005" stroke-width="1" transform="rotate(5,82,77)"/>
  <!-- Plank nails -->
  <circle cx="8" cy="73" r="1.5" fill="#2a2a2a"/>
  <circle cx="28" cy="78" r="1.5" fill="#2a2a2a"/>
  <circle cx="42" cy="71" r="1.5" fill="#2a2a2a"/>
  <circle cx="58" cy="71" r="1.5" fill="#2a2a2a"/>
  <!-- Glowing eyes inside pit -->
  <ellipse cx="38" cy="145" rx="5" ry="4" fill="#001100"/>
  <ellipse cx="38" cy="145" rx="3" ry="3" fill="#00FF44" opacity="0.9"/>
  <ellipse cx="62" cy="158" rx="5" ry="4" fill="#001100"/>
  <ellipse cx="62" cy="158" rx="3" ry="3" fill="#00FF44" opacity="0.9"/>
  <!-- Mud drips on side -->
  <path d="M10 85 Q8 100 10 115" stroke="#2d4a15" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M90 85 Q92 100 90 115" stroke="#2d4a15" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Rising bubble effect -->
  <circle cx="45" cy="130" r="3" fill="none" stroke="#4a7c28" stroke-width="1.5" opacity="0.7"/>
  <circle cx="60" cy="120" r="2" fill="none" stroke="#4a7c28" stroke-width="1" opacity="0.6"/>
</svg>
