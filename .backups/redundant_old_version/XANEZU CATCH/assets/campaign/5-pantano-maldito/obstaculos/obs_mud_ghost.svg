<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="gglow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#44FF88" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#44FF88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AAFFCC"/>
      <stop offset="100%" stop-color="#44AA66"/>
    </linearGradient>
    <filter id="gblur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <!-- Ghost glow -->
  <circle cx="50" cy="50" r="46" fill="url(#gglow)" filter="url(#gblur)"/>
  <!-- Wispy tails (bottom) -->
  <path d="M28 70 Q22 90 30 95 Q38 88 35 75" fill="#AAFFCC" opacity="0.7"/>
  <path d="M50 75 Q48 92 50 98 Q52 92 50 75" fill="#AAFFCC" opacity="0.8"/>
  <path d="M72 70 Q78 90 70 95 Q62 88 65 75" fill="#AAFFCC" opacity="0.7"/>
  <!-- Main ghost body -->
  <path d="M18 50 Q18 22 50 18 Q82 22 82 50 L82 72 Q78 70 72 74 Q68 78 62 74 Q56 70 50 74 Q44 78 38 74 Q32 70 28 74 Q22 70 18 72 Z" fill="url(#gbody)" stroke="#22AA55" stroke-width="2"/>
  <!-- Semi-transparent effect -->
  <path d="M18 50 Q18 22 50 18 Q82 22 82 50 L82 72 Q78 70 72 74 Q68 78 62 74 Q56 70 50 74 Q44 78 38 74 Q32 70 28 74 Q22 70 18 72 Z" fill="#AAFFCC" opacity="0.2"/>
  <!-- Eyes (hollow, scary) -->
  <ellipse cx="37" cy="44" rx="9" ry="10" fill="#001a0a"/>
  <ellipse cx="63" cy="44" rx="9" ry="10" fill="#001a0a"/>
  <!-- Eye gleam (eerie green) -->
  <ellipse cx="37" cy="44" rx="5" ry="6" fill="#00FF66" opacity="0.6"/>
  <ellipse cx="63" cy="44" rx="5" ry="6" fill="#00FF66" opacity="0.6"/>
  <circle cx="35" cy="42" r="2" fill="white" opacity="0.8"/>
  <circle cx="61" cy="42" r="2" fill="white" opacity="0.8"/>
  <!-- Mouth scream -->
  <path d="M36 58 Q50 68 64 58" stroke="#001a0a" stroke-width="2" fill="#001a0a" stroke-linecap="round"/>
  <!-- Mud splatters on ghost (it's a mud ghost) -->
  <circle cx="40" cy="30" r="4" fill="#4a3510" opacity="0.6"/>
  <circle cx="60" cy="35" r="3" fill="#4a3510" opacity="0.5"/>
  <circle cx="30" cy="50" r="3" fill="#4a3510" opacity="0.5"/>
  <circle cx="70" cy="45" r="4" fill="#4a3510" opacity="0.6"/>
  <!-- Drip from mud on ghost -->
  <path d="M40 34 Q40 40 39 45" stroke="#4a3510" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <circle cx="39" cy="46" r="2" fill="#4a3510" opacity="0.6"/>
  <!-- Floating sparkles -->
  <circle cx="15" cy="30" r="2" fill="#88ffaa" opacity="0.8"/>
  <circle cx="85" cy="40" r="2" fill="#88ffaa" opacity="0.8"/>
  <circle cx="10" cy="65" r="1.5" fill="#88ffaa" opacity="0.7"/>
  <circle cx="90" cy="60" r="1.5" fill="#88ffaa" opacity="0.7"/>
  <!-- Transparent body highlight -->
  <ellipse cx="38" cy="28" rx="12" ry="7" fill="white" fill-opacity="0.15"/>
</svg>
