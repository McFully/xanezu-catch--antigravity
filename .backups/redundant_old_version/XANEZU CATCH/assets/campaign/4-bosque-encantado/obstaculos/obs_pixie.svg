<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="pglow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FF88FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF88FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB3FF"/>
      <stop offset="100%" stop-color="#CC44FF"/>
    </linearGradient>
    <filter id="pblur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <!-- Glow aura -->
  <circle cx="50" cy="50" r="42" fill="url(#pglow)" filter="url(#pblur)"/>
  <!-- Wings (left) -->
  <ellipse cx="24" cy="46" rx="22" ry="14" fill="#FFAAFF" stroke="#CC44FF" stroke-width="1.5" transform="rotate(-15,24,46)" opacity="0.85"/>
  <ellipse cx="20" cy="55" rx="16" ry="9" fill="#FFCCFF" stroke="#CC44FF" stroke-width="1" transform="rotate(10,20,55)" opacity="0.7"/>
  <!-- Wings (right) -->
  <ellipse cx="76" cy="46" rx="22" ry="14" fill="#FFAAFF" stroke="#CC44FF" stroke-width="1.5" transform="rotate(15,76,46)" opacity="0.85"/>
  <ellipse cx="80" cy="55" rx="16" ry="9" fill="#FFCCFF" stroke="#CC44FF" stroke-width="1" transform="rotate(-10,80,55)" opacity="0.7"/>
  <!-- Body -->
  <ellipse cx="50" cy="52" rx="18" ry="22" fill="url(#pbody)" stroke="#7700AA" stroke-width="2"/>
  <!-- Head -->
  <circle cx="50" cy="32" r="17" fill="#FFB3FF" stroke="#7700AA" stroke-width="2"/>
  <!-- Hair -->
  <path d="M36 27 Q34 12 40 10 Q44 20 46 22" fill="#9900CC" stroke="#7700AA" stroke-width="1"/>
  <path d="M64 27 Q66 12 60 10 Q56 20 54 22" fill="#9900CC" stroke="#7700AA" stroke-width="1"/>
  <path d="M50 22 Q50 8 50 6 Q52 16 54 18" fill="#9900CC" stroke="#7700AA" stroke-width="1"/>
  <!-- Pointy ears -->
  <polygon points="34,29 28,18 36,24" fill="#FFB3FF" stroke="#7700AA" stroke-width="1"/>
  <polygon points="66,29 72,18 64,24" fill="#FFB3FF" stroke="#7700AA" stroke-width="1"/>
  <!-- Eyes (big, mischievous) -->
  <ellipse cx="43" cy="31" rx="6" ry="6.5" fill="white" stroke="#7700AA" stroke-width="1"/>
  <ellipse cx="57" cy="31" rx="6" ry="6.5" fill="white" stroke="#7700AA" stroke-width="1"/>
  <ellipse cx="43" cy="32" rx="4" ry="4" fill="#9900CC"/>
  <ellipse cx="57" cy="32" rx="4" ry="4" fill="#9900CC"/>
  <circle cx="41.5" cy="30" r="1.5" fill="white"/>
  <circle cx="55.5" cy="30" r="1.5" fill="white"/>
  <!-- Evil smirk -->
  <path d="M43 42 Q50 47 57 42" stroke="#7700AA" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Wand -->
  <line x1="68" y1="44" x2="84" y2="28" stroke="#9900CC" stroke-width="2" stroke-linecap="round"/>
  <circle cx="85" cy="27" r="5" fill="#FF44FF" stroke="#7700AA" stroke-width="1.5"/>
  <path d="M85 23 L86 27 L85 31 L84 27 Z" fill="white" opacity="0.9"/>
  <!-- Magic sparkles -->
  <circle cx="15" cy="35" r="2" fill="#FFAAFF" opacity="0.8"/>
  <circle cx="85" cy="70" r="2" fill="#FFAAFF" opacity="0.8"/>
  <circle cx="20" cy="72" r="1.5" fill="#FF88FF" opacity="0.7"/>
  <!-- Dress bottom -->
  <path d="M32 66 Q50 78 68 66 Q60 90 50 94 Q40 90 32 66Z" fill="#CC44FF" stroke="#7700AA" stroke-width="1.5"/>
</svg>
