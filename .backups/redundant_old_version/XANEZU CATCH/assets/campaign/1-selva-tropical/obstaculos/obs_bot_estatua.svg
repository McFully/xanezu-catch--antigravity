<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="140" height="180" viewBox="0 0 140 180">
    <defs>
        <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#DAA520"/>
            <stop offset="50%" stop-color="#FFD700"/>
            <stop offset="100%" stop-color="#B8860B"/>
        </linearGradient>
    </defs>
    <!-- Broken stone base -->
    <path d="M 30,180 L 110,180 L 100,140 L 40,140 Z" fill="#7F8C8D" stroke="#2C3E50" stroke-width="3"/>
    <path d="M 40,140 L 100,140 L 90,90 L 50,90 Z" fill="#95A5A6" stroke="#2C3E50" stroke-width="3"/>
    <!-- Broken God Head -->
    <circle cx="70" cy="90" r="40" fill="url(#gGold)" stroke="#8B6508" stroke-width="4"/>
    <path d="M 30,90 C 50,70 90,70 110,90" fill="none" stroke="#8B6508" stroke-width="3"/>
    <rect x="55" y="65" width="10" height="15" fill="#E74C3C"/>
    <rect x="75" y="65" width="10" height="15" fill="#E74C3C"/>
    <!-- Crack effect -->
    <path d="M 50,45 L 60,70 L 55,90 L 70,110 L 65,130" fill="none" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
    <path d="M 70,110 L 90,120" fill="none" stroke="#2C3E50" stroke-width="3"/>
</svg>
