<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="120" height="240" viewBox="0 0 120 240">
    <defs>
        <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5D6D7E"/>
            <stop offset="50%" stop-color="#85929E"/>
            <stop offset="100%" stop-color="#34495E"/>
        </linearGradient>
    </defs>
    <!-- Base -->
    <path d="M 20,240 L 100,240 L 90,80 L 30,80 Z" fill="url(#stoneGrad)" stroke="#2C3E50" stroke-width="4"/>
    <!-- Top Face -->
    <rect x="25" y="20" width="70" height="60" rx="5" fill="url(#stoneGrad)" stroke="#2C3E50" stroke-width="4"/>
    <!-- Face details -->
    <!-- Eyes -->
    <rect x="35" y="35" width="20" height="10" fill="#E74C3C"/>
    <rect x="65" y="35" width="20" height="10" fill="#E74C3C"/>
    <!-- Mouth -->
    <rect x="40" y="55" width="40" height="15" fill="#2C3E50"/>
    <path d="M 45,55 L 45,65 M 55,55 L 55,65 M 65,55 L 65,65 M 75,55 L 75,65" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Moss / Vines -->
    <path d="M 20,100 Q 40,120 30,200" fill="none" stroke="#27AE60" stroke-width="6" stroke-linecap="round"/>
    <path d="M 95,90 Q 75,150 90,220" fill="none" stroke="#2ecc71" stroke-width="5" stroke-linecap="round"/>
    <path d="M 25,20 L 50,20 Q 50,40 30,50" fill="none" stroke="#27AE60" stroke-width="4"/>
</svg>
