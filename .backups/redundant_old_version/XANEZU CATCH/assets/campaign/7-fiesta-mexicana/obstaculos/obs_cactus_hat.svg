<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" preserveAspectRatio="none">
  <defs>
    <linearGradient id="cac1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44BB22"/>
      <stop offset="100%" stop-color="#228800"/>
    </linearGradient>
    <linearGradient id="cac2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#228800"/>
      <stop offset="40%" stop-color="#66DD44"/>
      <stop offset="100%" stop-color="#228800"/>
    </linearGradient>
    <radialGradient id="cglow2" cx="50%" cy="30%">
      <stop offset="0%" stop-color="#88FF44" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#88FF44" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sombrero (big hat) -->
  <!-- Brim -->
  <ellipse cx="50" cy="35" rx="44" ry="14" fill="#D4891A" stroke="#8B5A00" stroke-width="2"/>
  <!-- Hat dome -->
  <ellipse cx="50" cy="26" rx="26" ry="20" fill="#E8A020" stroke="#8B5A00" stroke-width="2"/>
  <!-- Hat top ridge -->
  <ellipse cx="50" cy="14" rx="24" ry="8" fill="#F0B030"/>
  <!-- Hat band -->
  <rect x="24" y="28" width="52" height="8" rx="3" fill="#CC2200"/>
  <!-- Hat decoration dots -->
  <circle cx="35" cy="32" r="2" fill="#FFD700"/>
  <circle cx="45" cy="31" r="2" fill="#FFD700"/>
  <circle cx="55" cy="31" r="2" fill="#FFD700"/>
  <circle cx="65" cy="32" r="2" fill="#FFD700"/>
  <!-- Hat pompom -->
  <circle cx="50" cy="10" r="6" fill="#CC2200"/>
  <circle cx="50" cy="9" r="4" fill="#FF4444"/>
  <!-- Cactus main body -->
  <rect x="33" y="42" width="34" height="148" rx="17" fill="url(#cac2)" stroke="#1a6600" stroke-width="2"/>
  <rect x="35" y="44" width="30" height="144" rx="15" fill="url(#cac1)"/>
  <!-- Cactus highlight -->
  <ellipse cx="42" cy="80" rx="6" ry="50" fill="#66DD44" opacity="0.3"/>
  <!-- Left arm -->
  <path d="M33 100 Q10 95 8 80 Q8 62 18 62 Q22 72 20 80 Q25 78 33 82Z" fill="url(#cac1)" stroke="#1a6600" stroke-width="2"/>
  <path d="M34 100 Q12 94 10 80 Q10 66 18 66 Q20 74 19 80 Q24 79 34 82" fill="#44BB22" opacity="0.4"/>
  <!-- Right arm -->
  <path d="M67 90 Q90 85 92 70 Q92 52 82 52 Q78 62 80 70 Q75 68 67 72Z" fill="url(#cac1)" stroke="#1a6600" stroke-width="2"/>
  <path d="M66 90 Q88 84 90 70 Q90 56 82 56 Q80 64 81 70 Q76 69 66 72" fill="#44BB22" opacity="0.4"/>
  <!-- Thorns (main body) -->
  <line x1="33" y1="65" x2="24" y2="60" stroke="#1a6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="33" y1="75" x2="22" y2="73" stroke="#1a6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="33" y1="120" x2="22" y2="118" stroke="#1a6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="67" y1="65" x2="76" y2="60" stroke="#1a6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="67" y1="78" x2="78" y2="76" stroke="#1a6600" stroke-width="2" stroke-linecap="round"/>
  <line x1="67" y1="120" x2="78" y2="118" stroke="#1a6600" stroke-width="2" stroke-linecap="round"/>
  <!-- Face (cute cactus) -->
  <ellipse cx="44" cy="130" rx="5" ry="5.5" fill="#114400"/>
  <ellipse cx="56" cy="130" rx="5" ry="5.5" fill="#114400"/>
  <circle cx="43" cy="129" r="2" fill="white"/>
  <circle cx="55" cy="129" r="2" fill="white"/>
  <!-- Big mustache (Mexican style!) -->
  <path d="M36 142 Q43 148 50 143 Q57 148 64 142" stroke="#5a3000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M36 142 Q34 137 40 136 Q43 140 43 143" fill="#5a3000"/>
  <path d="M64 142 Q66 137 60 136 Q57 140 57 143" fill="#5a3000"/>
  <!-- Flowers on top of cactus -->
  <circle cx="50" cy="44" r="8" fill="#FF4444"/>
  <circle cx="50" cy="44" r="5" fill="#FFD700"/>
  <circle cx="50" cy="44" r="3" fill="#FF8800"/>
</svg>
