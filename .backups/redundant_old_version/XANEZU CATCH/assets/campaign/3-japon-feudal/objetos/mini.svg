<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <defs>
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
        </filter>
        <radialGradient id="potionLiquid" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00FFFF" />
            <stop offset="100%" stop-color="#00008B" />
        </radialGradient>
    </defs>
    <g filter="url(#dropShadow)">
        <!-- Flask body -->
        <polygon points="40,20 60,20 60,35 75,75 25,75 40,35" fill="rgba(255,255,255,0.4)" stroke="#FFF" stroke-width="4" stroke-linejoin="round"/>
        <!-- Liquid -->
        <polygon points="42,40 58,40 70,72 30,72" fill="url(#potionLiquid)"/>
        <!-- Bubbles -->
        <circle cx="45" cy="50" r="4" fill="#FFF" opacity="0.6"/>
        <circle cx="55" cy="60" r="3" fill="#FFF" opacity="0.6"/>
        <circle cx="40" cy="65" r="5" fill="#FFF" opacity="0.6"/>
        <circle cx="60" cy="50" r="2" fill="#FFF" opacity="0.6"/>
        <!-- Cork -->
        <rect x="42" y="10" width="16" height="10" rx="2" fill="#8B4513"/>
        <!-- Highlight -->
        <path d="M30,65 Q28,50 40,38" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    </g>
</svg>
