<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" preserveAspectRatio="none">
  <defs>
    <linearGradient id="st1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="40%" stop-color="#CC1111"/>
      <stop offset="100%" stop-color="#991111"/>
    </linearGradient>
    <linearGradient id="st2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#AA1111"/>
      <stop offset="50%" stop-color="#FF4444"/>
      <stop offset="100%" stop-color="#AA1111"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="40%" stop-color="#EEE"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>
  <!-- Rope from top -->
  <rect x="47" y="0" width="6" height="30" rx="3" fill="#5a3a00"/>
  <!-- Hung hat -->
  <ellipse cx="50" cy="38" rx="34" ry="10" fill="#3a2200" stroke="#1a0a00" stroke-width="1.5"/>
  <ellipse cx="50" cy="36" rx="22" ry="16" fill="#4a2a00" stroke="#1a0a00" stroke-width="1.5"/>
  <ellipse cx="50" cy="36" rx="22" ry="14" fill="#5a3a00"/>
  <!-- Hat band -->
  <rect x="28" y="30" width="44" height="7" rx="2" fill="#8B0000"/>
  <rect x="28" y="31" width="44" height="5" rx="2" fill="url(#st1)"/>
  <!-- Hat sheen -->
  <ellipse cx="42" cy="33" rx="12" ry="5" fill="white" fill-opacity="0.08"/>
  <!-- Soldier body (hanging from hat) -->
  <rect x="35" y="55" width="30" height="52" rx="6" fill="url(#st2)" stroke="#8B0000" stroke-width="2"/>
  <!-- Jacket detail -->
  <rect x="47" y="55" width="6" height="52" rx="2" fill="#8B0000"/>
  <!-- Buttons -->
  <circle cx="50" cy="65" r="2.5" fill="url(#metal)" stroke="#666" stroke-width="0.5"/>
  <circle cx="50" cy="76" r="2.5" fill="url(#metal)" stroke="#666" stroke-width="0.5"/>
  <circle cx="50" cy="87" r="2.5" fill="url(#metal)" stroke="#666" stroke-width="0.5"/>
  <!-- Epaulettes -->
  <ellipse cx="35" cy="62" rx="9" ry="6" fill="#8B0000" stroke="#5a0000" stroke-width="1"/>
  <ellipse cx="65" cy="62" rx="9" ry="6" fill="#8B0000" stroke="#5a0000" stroke-width="1"/>
  <!-- Head -->
  <circle cx="50" cy="46" r="14" fill="#FFD0A0" stroke="#CC9060" stroke-width="1.5"/>
  <!-- Face -->
  <ellipse cx="43" cy="45" rx="3.5" ry="3.5" fill="#222"/>
  <ellipse cx="57" cy="45" rx="3.5" ry="3.5" fill="#222"/>
  <circle cx="42" cy="44" r="1" fill="white"/>
  <circle cx="56" cy="44" r="1" fill="white"/>
  <!-- Mustache -->
  <path d="M43 51 Q50 55 57 51" stroke="#5a3000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M44 51 Q50 49 44 51" fill="#5a3000"/>
  <path d="M56 51 Q50 49 56 51" fill="#5a3000"/>
  <!-- Arms -->
  <rect x="12" y="56" width="25" height="10" rx="5" fill="url(#st2)" stroke="#8B0000" stroke-width="1.5" transform="rotate(20,24,61)"/>
  <rect x="62" y="56" width="25" height="10" rx="5" fill="url(#st2)" stroke="#8B0000" stroke-width="1.5" transform="rotate(-20,76,61)"/>
  <!-- Hands with weapons (spears) -->
  <rect x="8" y="74" width="4" height="28" rx="2" fill="#8B6500" transform="rotate(-10,10,88)"/>
  <polygon points="6,74 10,62 14,74" fill="url(#metal)" transform="rotate(-10,10,74)"/>
  <!-- Legs -->
  <rect x="38" y="105" width="10" height="55" rx="5" fill="#8B0000" stroke="#5a0000" stroke-width="1"/>
  <rect x="52" y="105" width="10" height="55" rx="5" fill="#8B0000" stroke="#5a0000" stroke-width="1"/>
  <!-- Boots -->
  <ellipse cx="43" cy="158" rx="10" ry="6" fill="#222" stroke="#111" stroke-width="1"/>
  <ellipse cx="57" cy="158" rx="10" ry="6" fill="#222" stroke="#111" stroke-width="1"/>
  <!-- Belt + buckle -->
  <rect x="35" y="102" width="30" height="6" rx="2" fill="#5a3000"/>
  <rect x="46" y="102" width="8" height="6" rx="1" fill="url(#metal)"/>
</svg>
