<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="160" height="150" viewBox="0 0 160 150">
    <defs>
        <radialGradient id="rockGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#EEDD82"/>
            <stop offset="50%" stop-color="#DAA520"/>
            <stop offset="100%" stop-color="#B8860B"/>
        </radialGradient>
    </defs>
    <!-- Base ceiling/wall part -->
    <path d="M 0,0 L 160,0 L 140,50 L 20,50 Z" fill="url(#rockGrad)" stroke="#8B6508" stroke-width="3"/>
    <!-- Falling blocks -->
    <rect x="30" y="50" width="40" height="60" rx="3" fill="url(#rockGrad)" stroke="#8B6508" stroke-width="2"/>
    <rect x="70" y="50" width="30" height="80" rx="2" fill="url(#rockGrad)" stroke="#8B6508" stroke-width="2"/>
    <!-- Hanging pointy rock -->
    <polygon points="40,110 60,110 50,140" fill="#DAA520" stroke="#8B6508"/>
    <!-- Cracks -->
    <path d="M 40,50 L 50,80 M 80,50 L 75,90 M 90,60 L 95,110" fill="none" stroke="#5C4033" stroke-width="2"/>
    <!-- Falling sand/dust FX -->
    <circle cx="50" cy="145" r="2" fill="#F0E68C" opacity="0.6"/>
    <circle cx="85" cy="135" r="3" fill="#F0E68C" opacity="0.5"/>
    <circle cx="70" cy="140" r="1" fill="#F0E68C" opacity="0.8"/>
</svg>
