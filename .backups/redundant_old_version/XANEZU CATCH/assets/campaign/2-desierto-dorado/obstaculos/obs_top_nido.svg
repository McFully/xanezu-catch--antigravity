<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="160" height="200" viewBox="0 0 160 200">
    <!-- Rock ledge it's hanging from -->
    <path d="M 0,0 L 160,0 L 140,40 L 20,40 Z" fill="#8B6508" stroke="#5C4033" stroke-width="4"/>
    <!-- Mess of sticks pointing down/out -->
    <polygon points="30,40 130,40 100,120 60,120" fill="#654321" stroke="#3E2723" stroke-width="3"/>
    <!-- Twig lines -->
    <path d="M 40,40 L 70,110 M 120,40 L 90,110 M 60,40 L 80,110 M 100,40 L 90,120" stroke="#8B4513" stroke-width="2"/>
    <path d="M 20,60 L 140,60 M 30,80 L 130,80 M 50,100 L 110,100" stroke="#A0522D" stroke-width="3"/>
    <path d="M 20,50 L 10,70 M 140,50 L 150,70 M 40,100 L 30,130 M 120,100 L 130,130 M 70,120 L 60,150 M 90,120 L 100,160" stroke="#8B4513" stroke-width="4"/>
    <!-- Vulture head/eyes peering from bottom -->
    <ellipse cx="80" cy="115" rx="15" ry="8" fill="#FFC0CB" stroke="#000" stroke-width="2"/>
    <circle cx="75" cy="115" r="3" fill="#FFD700"/>
    <circle cx="85" cy="115" r="3" fill="#FFD700"/>
    <circle cx="75" cy="115" r="1.5" fill="#000"/>
    <circle cx="85" cy="115" r="1.5" fill="#000"/>
</svg>
