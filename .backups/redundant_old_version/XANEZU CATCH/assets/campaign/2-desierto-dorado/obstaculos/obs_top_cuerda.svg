<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="80" height="260" viewBox="0 0 80 260">
    <!-- Rope segments -->
    <path d="M 40,0 L 40,240" fill="none" stroke="#D2B48C" stroke-width="12" stroke-dasharray="15 5"/>
    <!-- Knots -->
    <circle cx="40" cy="50" r="10" fill="#CD853F" stroke="#8B4513" stroke-width="2"/>
    <circle cx="40" cy="110" r="10" fill="#CD853F" stroke="#8B4513" stroke-width="2"/>
    <circle cx="40" cy="180" r="10" fill="#CD853F" stroke="#8B4513" stroke-width="2"/>
    <!-- Noose/loop at bottom -->
    <ellipse cx="40" cy="240" rx="15" ry="10" fill="none" stroke="#D2B48C" stroke-width="8"/>
    <circle cx="40" cy="225" r="12" fill="#CD853F" stroke="#8B4513" stroke-width="2"/>
    <path d="M 35,235 L 45,235 M 35,245 L 45,245" stroke="#FFFFFF" stroke-width="2"/>
</svg>
