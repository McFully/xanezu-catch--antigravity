<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="100" height="240" viewBox="0 0 100 240">
    <!-- Twisted dried vines -->
    <path d="M 50,0 Q 20,40 50,80 T 50,160 T 40,240" fill="none" stroke="#8B4513" stroke-width="10" stroke-linecap="round"/>
    <path d="M 50,0 Q 80,60 40,120 T 60,200" fill="none" stroke="#A0522D" stroke-width="6" stroke-linecap="round"/>
    <!-- Dead branches sticking out -->
    <path d="M 45,30 L 10,20 M 55,70 L 90,50 M 45,130 L 20,110 M 50,180 L 80,160 M 45,220 L 15,200" fill="none" stroke="#A0522D" stroke-width="3"/>
    <!-- Spikes along vines -->
    <path d="M 42,40 L 48,45" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 58,80 L 52,85" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 40,140 L 45,145" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 52,190 L 48,195" stroke="#FFFFFF" stroke-width="2"/>
</svg>
