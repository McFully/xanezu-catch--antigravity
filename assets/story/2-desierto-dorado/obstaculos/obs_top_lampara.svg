    <ellipse cx="60" cy="35" rx="5" ry="10" fill="none" stroke="#A9A9A9" stroke-width="3"/>
    <ellipse cx="60" cy="55" rx="5" ry="10" fill="none" stroke="#A9A9A9" stroke-width="3"/>
    <ellipse cx="60" cy="75" rx="5" ry="10" fill="none" stroke="#A9A9A9" stroke-width="3"/>
    <!-- Lamp Cap -->
