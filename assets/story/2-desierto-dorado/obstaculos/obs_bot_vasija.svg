<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="140" height="180" viewBox="0 0 140 180">
    <defs>
        <radialGradient id="clayGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#E9967A"/>
            <stop offset="70%" stop-color="#8B4513"/>
            <stop offset="100%" stop-color="#5C4033"/>
        </radialGradient>
    </defs>
    <!-- Pot body -->
    <ellipse cx="70" cy="120" rx="60" ry="50" fill="url(#clayGrad)" stroke="#3E2723" stroke-width="4"/>
    <path d="M 40,80 C 40,40 100,40 100,80 L 130,120 L 10,120 Z" fill="url(#clayGrad)" stroke="#3E2723" stroke-width="3"/>
    <!-- Pot rim -->
    <ellipse cx="70" cy="40" rx="35" ry="10" fill="#CD5C5C" stroke="#3E2723" stroke-width="4"/>
    <ellipse cx="70" cy="40" rx="25" ry="5" fill="#3E2723"/>
    <!-- Cracked hole with a snake -->
    <path d="M 50,120 L 60,100 L 55,140 L 40,150" fill="none" stroke="#2C1605" stroke-width="3"/>
    <!-- Snake sticking out top -->
    <path d="M 70,40 Q 50,-10 90,20 Q 100,30 95,10" fill="none" stroke="#32CD32" stroke-width="6"/>
    <circle cx="95" cy="10" r="3" fill="#FF0000"/>
</svg>
