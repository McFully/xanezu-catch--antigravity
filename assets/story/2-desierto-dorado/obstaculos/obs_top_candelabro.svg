<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="140" height="220" viewBox="0 0 140 220">
    <!-- Rope -->
    <path d="M 70,0 L 70,80" fill="none" stroke="#D2B48C" stroke-width="6" stroke-dasharray="8 4"/>
    <!-- Main branch / bone cross -->
    <rect x="20" y="80" width="100" height="15" rx="5" fill="#FDF5E6" stroke="#5C4033" stroke-width="3"/>
    <rect x="65" y="60" width="10" height="100" rx="3" fill="#FDF5E6" stroke="#5C4033" stroke-width="3"/>
    <!-- Skulls serving as candle holders -->
    <!-- Left skull -->
    <ellipse cx="25" cy="70" rx="10" ry="12" fill="#DEB887" stroke="#8B4513" stroke-width="2"/>
    <ellipse cx="22" cy="68" rx="2" ry="3" fill="#000"/>
    <ellipse cx="28" cy="68" rx="2" ry="3" fill="#000"/>
    <!-- Right skull -->
    <ellipse cx="115" cy="70" rx="10" ry="12" fill="#DEB887" stroke="#8B4513" stroke-width="2"/>
    <ellipse cx="112" cy="68" rx="2" ry="3" fill="#000"/>
    <ellipse cx="118" cy="68" rx="2" ry="3" fill="#000"/>
    <!-- Center skull -->
    <ellipse cx="70" cy="170" rx="15" ry="18" fill="#DEB887" stroke="#8B4513" stroke-width="2"/>
    <ellipse cx="65" cy="165" rx="3" ry="4" fill="#000"/>
    <ellipse cx="75" cy="165" rx="3" ry="4" fill="#000"/>
    <!-- Candles -->
    <rect x="22" y="40" width="6" height="20" fill="#FFF" stroke="#CCC"/>
    <rect x="112" y="40" width="6" height="20" fill="#FFF" stroke="#CCC"/>
    <rect x="67" y="130" width="6" height="25" fill="#FFF" stroke="#CCC"/>
    <!-- Flames -->
    <path d="M 25,25 Q 28,35 25,40 Q 22,35 25,25" fill="#FF8C00"/>
    <path d="M 115,25 Q 118,35 115,40 Q 112,35 115,25" fill="#FF8C00"/>
    <path d="M 70,110 Q 73,125 70,130 Q 67,125 70,110" fill="#FF8C00"/>
</svg>
