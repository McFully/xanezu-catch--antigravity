<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" preserveAspectRatio="none">
  <defs>
    <linearGradient id="ib1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66AACC"/>
      <stop offset="100%" stop-color="#AAEEFF"/>
    </linearGradient>
    <linearGradient id="ib2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6699BB"/>
      <stop offset="30%" stop-color="#CCEEFF"/>
      <stop offset="100%" stop-color="#6699BB"/>
    </linearGradient>
    <radialGradient id="ibglow" cx="50%" cy="85%">
      <stop offset="0%" stop-color="#88DDFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#88DDFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="ibblur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- Glow from base -->
  <ellipse cx="50" cy="160" rx="46" ry="40" fill="url(#ibglow)" filter="url(#ibblur)"/>
  <!-- Ice base platform -->
  <rect x="0" y="160" width="100" height="40" rx="0" fill="#5599BB"/>
  <rect x="0" y="155" width="100" height="10" rx="5" fill="#88CCEE"/>
  <!-- Snow/ice on base surface -->
  <path d="M0 155 Q15 150 30 156 Q45 150 60 156 Q75 150 90 156 Q100 153 100 155" fill="white" opacity="0.7"/>
  <!-- Ice spikes growing from base (bottom, pointing up) -->
  <!-- Left large spike -->
  <polygon points="8,160 24,160 14,20" fill="url(#ib1)" stroke="#4488AA" stroke-width="1.5"/>
  <polygon points="11,160 21,160 15,60" fill="white" opacity="0.3"/>
  <!-- Center huge spike -->
  <polygon points="38,160 62,160 50,0" fill="url(#ib2)" stroke="#4488AA" stroke-width="2"/>
  <polygon points="43,160 57,160 50,40" fill="white" opacity="0.3"/>
  <!-- Right large spike -->
  <polygon points="76,160 92,160 86,20" fill="url(#ib1)" stroke="#4488AA" stroke-width="1.5"/>
  <polygon points="79,160 89,160 85,60" fill="white" opacity="0.3"/>
  <!-- Small spikes -->
  <polygon points="0,160 10,160 3,90" fill="url(#ib1)" stroke="#4488AA" stroke-width="1"/>
  <polygon points="26,160 36,160 30,70" fill="url(#ib1)" stroke="#4488AA" stroke-width="1"/>
  <polygon points="64,160 74,160 68,65" fill="url(#ib1)" stroke="#4488AA" stroke-width="1"/>
  <polygon points="90,160 100,160 97,90" fill="url(#ib1)" stroke="#4488AA" stroke-width="1"/>
  <!-- Ice crack textures -->
  <line x1="38" y1="100" x2="62" y2="102" stroke="#99CCEE" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="130" x2="60" y2="132" stroke="#99CCEE" stroke-width="1" opacity="0.4"/>
  <!-- Frost sparkles -->
  <circle cx="14" cy="50" r="2" fill="white" opacity="0.9"/>
  <circle cx="50" cy="30" r="3" fill="white" opacity="0.9"/>
  <circle cx="86" cy="45" r="2" fill="white" opacity="0.9"/>
  <circle cx="30" cy="90" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="68" cy="80" r="1.5" fill="white" opacity="0.8"/>
  <!-- Water drip at tip of main spike -->
  <ellipse cx="50" cy="5" rx="3" ry="4" fill="#AAEEFF" opacity="0.8"/>
</svg>
