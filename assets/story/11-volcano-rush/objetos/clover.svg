<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <defs>
        <filter id="cloverGlow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="leafGrad" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#69F0AE"/>
            <stop offset="60%" stop-color="#4CAF50"/>
            <stop offset="100%" stop-color="#2E7D32"/>
        </radialGradient>
    </defs>
    <g filter="url(#cloverGlow)" transform="translate(50,45)">
        <!-- Four leaves -->
        <ellipse cx="0" cy="-16" rx="12" ry="16" fill="url(#leafGrad)" stroke="#1B5E20" stroke-width="1"/>
        <ellipse cx="0" cy="16" rx="12" ry="16" fill="url(#leafGrad)" stroke="#1B5E20" stroke-width="1"/>
        <ellipse cx="-16" cy="0" rx="16" ry="12" fill="url(#leafGrad)" stroke="#1B5E20" stroke-width="1"/>
        <ellipse cx="16" cy="0" rx="16" ry="12" fill="url(#leafGrad)" stroke="#1B5E20" stroke-width="1"/>
        <!-- Heart shapes on leaves -->
        <path d="M 0,-24 C -4,-20 -4,-14 0,-10 C 4,-14 4,-20 0,-24 Z" fill="#A5D6A7" opacity="0.5"/>
        <path d="M 0,24 C -4,20 -4,14 0,10 C 4,14 4,20 0,24 Z" fill="#A5D6A7" opacity="0.5"/>
        <path d="M -24,0 C -20,-4 -14,-4 -10,0 C -14,4 -20,4 -24,0 Z" fill="#A5D6A7" opacity="0.5"/>
        <path d="M 24,0 C 20,-4 14,-4 10,0 C 14,4 20,4 24,0 Z" fill="#A5D6A7" opacity="0.5"/>
        <!-- Center -->
        <circle cx="0" cy="0" r="4" fill="#2E7D32"/>
        <!-- Stem -->
        <path d="M 0,5 C 2,20 -2,35 0,48" fill="none" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
    </g>
</svg>
