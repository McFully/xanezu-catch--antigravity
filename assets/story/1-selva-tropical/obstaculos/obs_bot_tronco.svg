<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="140" height="200" viewBox="0 0 140 200">
    <defs>
        <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5C4033"/>
            <stop offset="50%" stop-color="#8B5A2B"/>
            <stop offset="100%" stop-color="#3E2723"/>
        </linearGradient>
    </defs>
    <!-- Trunk -->
    <path d="M 40,200 L 100,200 L 95,50 L 55,30 Z" fill="url(#woodGrad)" stroke="#2C1605" stroke-width="5" stroke-linejoin="round"/>
    <!-- Broken top -->
    <path d="M 55,30 L 65,10 L 75,40 L 95,50 Z" fill="#D2B48C" stroke="#2C1605" stroke-width="3"/>
    <!-- Spikes -->
    <path d="M 45,150 L 15,130 L 50,120 Z" fill="#6B238E" stroke="#4B0082" stroke-width="2"/>
    <path d="M 95,140 L 125,120 L 90,100 Z" fill="#6B238E" stroke="#4B0082" stroke-width="2"/>
    <path d="M 50,80 L 10,60 L 55,50 Z" fill="#6B238E" stroke="#4B0082" stroke-width="2"/>
    <path d="M 90,60 L 130,40 L 85,30 Z" fill="#6B238E" stroke="#4B0082" stroke-width="2"/>
    <path d="M 60,30 L 70,-5 L 80,35 Z" fill="#6B238E" stroke="#4B0082" stroke-width="2"/>
    <!-- Wood details -->
    <path d="M 50,200 L 60,100 M 70,200 L 80,60 M 90,200 L 85,100" fill="none" stroke="#2C1605" stroke-width="3" stroke-linecap="round"/>
</svg>
