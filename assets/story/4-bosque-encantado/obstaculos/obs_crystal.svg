<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" preserveAspectRatio="none">
  <defs>
    <linearGradient id="cr1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66DDFF"/>
      <stop offset="50%" stop-color="#AA88FF"/>
      <stop offset="100%" stop-color="#4422AA"/>
    </linearGradient>
    <linearGradient id="cr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cglow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#AA88FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#AA88FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cblur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- Glow aura -->
  <ellipse cx="50" cy="100" rx="40" ry="60" fill="url(#cglow)" filter="url(#cblur)"/>
  <!-- Main crystal cluster - center large -->
  <polygon points="50,10 36,80 50,110 64,80" fill="url(#cr1)" stroke="#2200AA" stroke-width="2"/>
  <polygon points="50,10 36,80 50,110 64,80" fill="url(#cr2)"/>
  <!-- Left crystal 1 -->
  <polygon points="25,40 15,100 28,120 38,80" fill="url(#cr1)" stroke="#2200AA" stroke-width="1.5" opacity="0.9"/>
  <polygon points="25,40 15,100 28,120 38,80" fill="url(#cr2)" opacity="0.7"/>
  <!-- Right crystal 1 -->
  <polygon points="75,40 85,100 72,120 62,80" fill="url(#cr1)" stroke="#2200AA" stroke-width="1.5" opacity="0.9"/>
  <polygon points="75,40 85,100 72,120 62,80" fill="url(#cr2)" opacity="0.7"/>
  <!-- Small crystals -->
  <polygon points="12,90 6,140 18,155 24,120" fill="url(#cr1)" stroke="#2200AA" stroke-width="1" opacity="0.8"/>
  <polygon points="88,90 94,140 82,155 76,120" fill="url(#cr1)" stroke="#2200AA" stroke-width="1" opacity="0.8"/>
  <!-- Center big crystal bottom -->
  <polygon points="40,110 30,180 50,200 70,180 60,110" fill="#4422AA" stroke="#2200AA" stroke-width="2"/>
  <polygon points="40,110 30,180 50,200 70,180 60,110" fill="url(#cr2)" opacity="0.5"/>
  <!-- Inner glow lines -->
  <line x1="50" y1="10" x2="50" y2="110" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="36" y1="80" x2="64" y2="80" stroke="white" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Sparkle dots -->
  <circle cx="50" cy="55" r="3" fill="white" opacity="0.9"/>
  <circle cx="35" cy="70" r="2" fill="white" opacity="0.8"/>
  <circle cx="65" cy="65" r="2" fill="white" opacity="0.8"/>
  <circle cx="20" cy="95" r="1.5" fill="#CCAAFF" opacity="0.9"/>
  <circle cx="80" cy="90" r="1.5" fill="#CCAAFF" opacity="0.9"/>
  <!-- Small star sparkles -->
  <path d="M50 40 L51.5 44 L56 45 L51.5 46 L50 50 L48.5 46 L44 45 L48.5 44 Z" fill="white" opacity="0.9"/>
</svg>
