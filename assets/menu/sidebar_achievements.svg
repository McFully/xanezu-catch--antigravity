    <path d="M30,42 L30,48 M22,48 L38,48" stroke="#4B2E0B" stroke-width="4" stroke-linecap="round"/>
    <!-- Asas -->
    <path d="M15,20 C10,20 10,28 15,28" fill="none" stroke="#4B2E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M45,20 C50,20 50,28 45,28" fill="none" stroke="#4B2E0B" stroke-width="3" stroke-linecap="round"/>
    <!-- Estrella -->
    <path d="M30,22 L32,27 L37,27 L33,31 L34,36 L30,33 L26,36 L27,31 L23,27 L28,27 Z" fill="#FFC107"/>
