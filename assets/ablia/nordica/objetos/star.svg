<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <polygon points="50,10 61,38 90,38 66,56 76,85 50,68 24,85 34,56 10,38 39,38" fill="#FFD700" stroke="#FFA500" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="3s" repeatCount="indefinite" />
  </polygon>
  <circle cx="50" cy="50" r="40" stroke="#fff" stroke-width="2" fill="none" opacity="0.5">
     <animate attributeName="r" values="30;45;30" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg>
