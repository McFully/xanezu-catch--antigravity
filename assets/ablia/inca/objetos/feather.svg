<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <defs>
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
        </filter>
        <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD700" />
            <stop offset="50%" stop-color="#FF6347" />
            <stop offset="100%" stop-color="#8A2BE2" />
        </linearGradient>
    </defs>
    <g filter="url(#dropShadow)" transform="rotate(45 50 50)">
        <path d="M50,10 C70,30 70,60 50,90 C30,60 30,30 50,10 Z" fill="url(#featherGrad)"/>
        <path d="M50,15 C65,35 65,55 50,85 C35,55 35,35 50,15 Z" fill="rgba(255,255,255,0.3)"/>
        <line x1="50" y1="10" x2="50" y2="85" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
        <!-- Cuts in the feather -->
        <line x1="50" y1="30" x2="65" y2="25" stroke="#222" stroke-width="3" stroke-linecap="round"/>
        <line x1="50" y1="50" x2="35" y2="45" stroke="#222" stroke-width="3" stroke-linecap="round"/>
        <line x1="50" y1="70" x2="62" y2="65" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    </g>
</svg>
