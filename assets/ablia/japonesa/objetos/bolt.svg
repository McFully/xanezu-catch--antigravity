<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <defs>
        <filter id="boltGlow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF176"/>
            <stop offset="40%" stop-color="#FFEB3B"/>
            <stop offset="100%" stop-color="#FF9800"/>
        </linearGradient>
    </defs>
    <g filter="url(#boltGlow)">
        <!-- Lightning bolt shape -->
        <polygon points="55,5 20,50 42,50 30,95 80,42 55,42 68,5" 
                 fill="url(#boltGrad)" stroke="#E65100" stroke-width="2" stroke-linejoin="round"/>
        <!-- Inner highlight -->
        <polygon points="55,12 28,48 44,48 35,85 72,45 55,45 64,12" 
                 fill="#FFFDE7" opacity="0.5"/>
        <!-- Bright center line -->
        <path d="M 55,10 L 38,48 L 50,48 L 38,88" fill="none" stroke="#FFF" stroke-width="2" opacity="0.7"/>
    </g>
</svg>
